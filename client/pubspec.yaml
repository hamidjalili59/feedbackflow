name: feedbackflow_flutter_client
description: FeedbackFlow Flutter client generated against the backend OpenAPI contract.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.9.2
  drift: 2.31.0
  drift_flutter: 0.2.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  flutter_secure_storage: ^10.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  json_annotation: ^4.11.0
  cupertino_icons: ^1.0.8
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  drift_dev: 2.31.0
  freezed: ^3.2.5
  json_serializable: 6.13.0
  riverpod_generator: 4.0.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#F3F3F5"
  color_dark: "#0B1020"
  android: true
  ios: true
  web: false
  android_12:
    icon_background_color: "#F3F3F5"
    icon_background_color_dark: "#0B1020"

flutter:
  uses-material-design: true
  fonts:
    - family: AbarFaNum
      fonts:
        - asset: assets/fonts/AbarFaNum-VF.ttf
          weight: 100
        - asset: assets/fonts/AbarFaNum-VF.ttf
          weight: 400
        - asset: assets/fonts/AbarFaNum-VF.ttf
          weight: 500
        - asset: assets/fonts/AbarFaNum-VF.ttf
          weight: 600
        - asset: assets/fonts/AbarFaNum-VF.ttf
          weight: 700
        - asset: assets/fonts/AbarFaNum-VF.ttf
          weight: 900
    - family: Abar
      fonts:
        - asset: assets/fonts/Abar-VF.ttf
    - family: AbarNoEn
      fonts:
        - asset: assets/fonts/AbarNoEn-VF.ttf
